# Agent sandbox — run opencode agents with full control inside a container.
#
#   # fill in JADE_AGENT_GH_TOKEN and JADE_AGENT_OPENCODE_API_KEY in .env.agent (git-ignored)
#   docker compose --env-file .env.agent run --rm --service-ports agent
#   opencode                                     # pick the orchestrator agent
#
# --service-ports publishes the app to http://localhost:15173 (web) and :13001 (server) so you
# can watch it; override with JADE_AGENT_WEB_PORT / JADE_AGENT_SERVER_PORT, or drop the flag
# if you don't need to reach the app from the host. Agents use localhost inside the container.
#
# Both secrets are plain env vars inside the container, so agents can read them.
#
# JADE_AGENT_YOLO=true loads opencode.yolo.json (mounted read-only) via OPENCODE_CONFIG, which
# the image's ~/.bashrc sets in every interactive shell, including `docker exec` ones: every
# permission that isn't explicitly denied is auto-approved, like `opencode --auto`. Deny and ask
# rules in .opencode/agents/*.md still apply, and .env files stay unreadable. opencode never
# loads opencode.yolo.json on its own, so the host is unaffected. Edit the file to tune it.
#
# The repo is cloned into the `work` volume on first start, so the host checkout, ~/.ssh,
# ~/.config/gh, ~/.config/opencode, and the repo-root .env are never visible to agents.
# Copy results out with `docker compose cp agent:/home/pwuser/work/<path> .` or review the
# branch/PR the agents push.
#
# With --env-file .env.agent, ${...} values come from that file instead of the app's .env;
# only the JADE_AGENT_* variables below are used.

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: jade-court-agent-sandbox
    init: true
    # Playwright recommends host IPC for Chromium in Docker.
    ipc: host
    stdin_open: true
    tty: true
    mem_limit: 8g
    cpus: 4
    pids_limit: 2048
    # Host ports default away from 5173/3001 so they don't clash with `pnpm dev` or other local
    # servers; inside the container the app still uses 5173 (web) and 3001 (server).
    ports:
      - '127.0.0.1:${JADE_AGENT_WEB_PORT:-15173}:5173'
      - '127.0.0.1:${JADE_AGENT_SERVER_PORT:-13001}:3001'
    environment:
      GH_TOKEN: ${JADE_AGENT_GH_TOKEN:?set JADE_AGENT_GH_TOKEN to a fine-grained PAT scoped to sea2709/jade-court}
      OPENCODE_API_KEY: ${JADE_AGENT_OPENCODE_API_KEY:?set JADE_AGENT_OPENCODE_API_KEY to your OpenCode Zen API key}
      # OpenCode Go shares OPENCODE_API_KEY but needs its own subscription; without this, opencode
      # picks a Go model as the default/title model and requests fail. Remove if you have Go.
      OPENCODE_CONFIG_CONTENT: '{"disabled_providers":["opencode-go"]}'
      JADE_AGENT_YOLO: ${JADE_AGENT_YOLO:-false}
      GIT_AUTHOR_NAME: ${JADE_AGENT_GIT_NAME:-Jade Court Agent}
      GIT_AUTHOR_EMAIL: ${JADE_AGENT_GIT_EMAIL:-jade-court-agent@users.noreply.github.com}
      GIT_COMMITTER_NAME: ${JADE_AGENT_GIT_NAME:-Jade Court Agent}
      GIT_COMMITTER_EMAIL: ${JADE_AGENT_GIT_EMAIL:-jade-court-agent@users.noreply.github.com}
    volumes:
      - work:/home/pwuser/work
      # opencode session history (and any `opencode auth login` credentials).
      - opencode-data:/home/pwuser/.local/share/opencode
      - ./opencode.yolo.json:/opt/jade-agent/opencode.yolo.json:ro
    command:
      - bash
      - -lc
      - |
        set -e
        gh auth setup-git
        if [ ! -d jade-court/.git ]; then
          git clone https://github.com/sea2709/jade-court.git jade-court
          (cd jade-court && pnpm install && pnpm build)
        fi
        cd jade-court
        if [ "$${JADE_AGENT_YOLO}" = true ]; then
          echo "opencode YOLO mode: ON (auto-approves everything not explicitly denied)"
        fi
        exec bash

volumes:
  work:
  opencode-data:
