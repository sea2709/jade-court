name: Feature request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem and proposed solution. For large features, link to a plan or discussion if one exists.

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What user need or gap does this address?
      placeholder: New players cannot tell when they are in check...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should Jade Court behave?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Learn / coach
        - Play vs computer
        - Lessons / puzzles
        - Multiplayer
        - Engine / rules
        - Dev tooling
        - Other
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope notes
      options:
        - label: This likely touches `packages/xiangqi-engine`
        - label: This likely touches server WebSocket/API
        - label: UI-only change in `apps/web`
